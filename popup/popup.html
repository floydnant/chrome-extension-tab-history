<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab History Navigation</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <section class="controls">
          <button
            id="backButton"
            class="iconButton"
            type="button"
            aria-label="Go back"
            title="Go back"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M9.75 3.25L5 8l4.75 4.75" />
            </svg>
          </button>
          <button
            id="forwardButton"
            class="iconButton"
            type="button"
            aria-label="Go forward"
            title="Go forward"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M6.25 3.25L11 8l-4.75 4.75" />
            </svg>
          </button>
        </section>

        <h1>Tab History</h1>

        <div class="headerActions">
          <button id="refreshButton" class="secondary">Refresh</button>
        </div>
      </header>

      <section id="statusCard" class="statusCard" hidden>
        <p id="statusLine" class="statusLine"></p>
      </section>

      <section class="searchSection">
        <input
          id="searchInput"
          class="searchInput"
          type="text"
          placeholder="Filter history"
          autocomplete="off"
          spellcheck="false"
          aria-label="Filter timeline"
        />
      </section>

      <section class="timelineSection">
        <ol id="timelineList" class="timelineList"></ol>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
