<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab History Navigation</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Tab History</h1>
        <div class="headerActions">
          <button id="refreshButton" class="secondary">Refresh</button>
        </div>
      </header>

      <section class="controls">
        <button id="backButton">Back</button>
        <button id="forwardButton">Forward</button>
      </section>

      <section id="statusCard" class="statusCard" hidden>
        <p id="statusLine" class="statusLine"></p>
      </section>

      <section class="timelineSection">
        <ol id="timelineList" class="timelineList"></ol>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
